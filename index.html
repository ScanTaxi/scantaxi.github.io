    <!-- Telegram Mini App SDK: нужен до FOUC-темы и до бандла (initDataUnsafe.user). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Синхронизировать логику ключа с services/telegramUser.ts (scopedLocalStorageKey + миграция theme). -->
    <script>
        try {
            (function () {
                var THEME_KEY = 'taxiScan_theme';
                var u = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user;
                var tid = u && typeof u.id === 'number' && u.id > 0 ? u.id : null;
                var activeKey = THEME_KEY;
                if (tid != null) {
                    var sk = THEME_KEY + '_tg_' + tid;
                    if (localStorage.getItem(sk) == null) {
                        var leg = localStorage.getItem(THEME_KEY);
                        if (leg != null) localStorage.setItem(sk, leg);
                    }
                    activeKey = sk;
                }
                if (localStorage.getItem(activeKey) === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            })();
        } catch (e) { }
    </script>
